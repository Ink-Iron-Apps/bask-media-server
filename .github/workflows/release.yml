name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for re-running a release that failed partway'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published before the tests pass on the exact commit being
  # tagged. A release that fails here leaves no half-published artefacts.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.plain }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Work out the version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "plain=${tag#v}" >> "$GITHUB_OUTPUT"
          # A container registry refuses a repository name that is not all
          # lowercase, and this owner is not.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # One runner builds every target. The SQLite driver is pure Go, so
      # CGO_ENABLED=0 cross-compiles all six without a toolchain per platform
      # and without a matrix of runners to keep in step.
      - name: Build every target
        env:
          VERSION: ${{ steps.version.outputs.plain }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            os=${target%/*}
            arch=${target#*/}
            echo "== $os/$arch"

            staging="build/bms_${VERSION}_${os}_${arch}"
            rm -rf "$staging"
            mkdir -p "$staging/packaging"

            binary="$staging/bms"
            if [ "$os" = windows ]; then binary="$staging/bms.exe"; fi

            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$binary" ./cmd/bms

            cp README.md LICENSE "$staging/"
            cp packaging/bms.conf.example "$staging/packaging/"
            case "$os" in
              linux)
                cp packaging/bask-media-server.service packaging/install.sh "$staging/packaging/"
                ;;
              windows)
                cp packaging/install.ps1 "$staging/packaging/"
                ;;
            esac

            # install.sh unpacks the archive and reads packaging/ from the top
            # of it, so the archive has no extra directory level inside.
            if [ "$os" = windows ]; then
              ( cd "$staging" && zip -qr "../../dist/bms_${VERSION}_${os}_${arch}.zip" . )
            else
              tar -czf "dist/bms_${VERSION}_${os}_${arch}.tar.gz" -C "$staging" .
            fi
          done

          # The installers verify against this before unpacking anything, and
          # it is relative so `sha256sum -c` works from the download directory.
          ( cd dist && sha256sum * > SHA256SUMS )
          cat dist/SHA256SUMS

      # The installers are published as release assets too, so the one-line
      # install command can fetch a script pinned to a release rather than
      # whatever is on the default branch at that moment.
      - name: Stage the installers
        run: cp packaging/install.sh packaging/install.ps1 dist/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.plain }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<NOTES
          ## Install

          **Linux**

          \`\`\`
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | sudo sh
          \`\`\`

          **Windows**, from an elevated PowerShell

          \`\`\`
          irm https://github.com/${{ github.repository }}/releases/download/${TAG}/install.ps1 | iex
          \`\`\`

          **Docker**

          \`\`\`
          docker run -d --name bask-media-server \\
            -p 32500:32500 \\
            -v bms-data:/var/lib/bask-media-server \\
            -v /mnt/media:/mnt/media:ro \\
            ${{ steps.version.outputs.image }}:${VERSION}
          \`\`\`

          **macOS**, and anything else: download the archive below, unpack it,
          and run \`./bms -config bms.conf\`.

          Nothing here needs compiling or a runtime installed. \`ffmpeg\` is
          needed only for converting files a client cannot play and for finding
          intro and credits markers; direct play works without it.

          Verify a download against \`SHA256SUMS\` before running it.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Bask Media Server $VERSION" \
              --notes-file "$notes" \
              --verify-tag
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.plain }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.plain }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
