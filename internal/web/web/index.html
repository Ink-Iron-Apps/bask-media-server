<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bask</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e9a13b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>

<main id="signin" class="signin" hidden>
  <form id="signin-form" class="card signin-card">
    <h1 id="signin-name">Bask</h1>
    <p class="muted">Sign in with your token. Whoever runs this server issues one per device.</p>
    <label for="token">Token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" required>
    <p id="signin-error" class="error" hidden></p>
    <button type="submit" class="primary">Sign in</button>
  </form>
</main>

<div id="app" class="app" hidden>
  <header class="bar">
    <a href="#/" class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span id="brand-name">Bask</span>
    </a>
    <nav id="libraries" class="libraries"></nav>
    <form id="search-form" class="search" role="search">
      <input id="search" type="search" placeholder="Search" spellcheck="false" aria-label="Search the library">
    </form>
    <div class="who">
      <a id="to-admin" href="/admin/" class="muted" hidden>Admin</a>
      <span id="who" class="muted"></span>
      <button id="signout" class="link">Sign out</button>
    </div>
  </header>
  <main id="main" class="main"></main>
</div>

<!-- The player lives outside the view that opened it, so navigating back does
     not tear the video element down and start the file again. -->
<div id="player" class="player" hidden>
  <video id="video" playsinline controls></video>
  <div class="player-bar">
    <button id="player-back" class="ghost">‹ Back</button>
    <span id="player-title"></span>
    <span id="player-skip"></span>
  </div>
  <div id="player-error" class="player-error" hidden></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/web/app.js"></script>
</body>
</html>
