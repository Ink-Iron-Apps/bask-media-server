<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bask Media Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e9a13b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>

<!-- Sign-in. The token is the one the server printed on first run, or one
     issued from the Users page. There is no password store here by design. -->
<main id="signin" class="signin" hidden>
  <form id="signin-form" class="card signin-card">
    <h1>Bask Media Server</h1>
    <p class="muted">Sign in with an admin token. The first run printed one.</p>
    <label for="token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" required>
    <p id="signin-error" class="error" hidden></p>
    <button type="submit" class="primary">Sign in</button>
  </form>
</main>

<div id="app" class="app" hidden>
  <nav class="side">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-name" id="brand-name">Bask</span>
    </div>
    <a href="#/overview" data-view="overview">Overview</a>
    <a href="#/libraries" data-view="libraries">Libraries</a>
    <a href="#/jobs" data-view="jobs">Activity</a>
    <a href="#/users" data-view="users">Users</a>
    <a href="#/settings" data-view="settings">Settings</a>
    <div class="side-foot">
      <span id="who" class="muted"></span>
      <button id="signout" class="link">Sign out</button>
    </div>
  </nav>
  <main id="main" class="main" aria-live="polite"></main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/admin/app.js"></script>
</body>
</html>
